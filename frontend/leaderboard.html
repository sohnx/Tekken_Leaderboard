    /* ═══════════════════════════════════════════════════════════
       TECHTRIX 2026 × TEKKEN 8 — PS5 LEADERBOARD
       Doomsday Apocalypse × PlayStation 5 UI Language
       ═══════════════════════════════════════════════════════════ */

    :root {
      /* Core Palette — PS5 meets Techtrix Doomsday */
      --bg-void:        #04050a;
      --bg-deep:        #080b14;
      --bg-panel:       rgba(8, 12, 22, 0.94);
      --bg-card:        rgba(12, 17, 32, 0.88);

      /* Techtrix brand neons */
      --neon-red:       #ff1a3c;
      --neon-red-glow:  rgba(255, 26, 60, 0.6);
      --neon-blue:      #00d4ff;
      --neon-blue-glow: rgba(0, 212, 255, 0.5);
      --neon-purple:    #b344ff;
      --neon-gold:      #ffd700;
      --neon-gold-glow: rgba(255, 215, 0, 0.5);
      --neon-green:     #00ff88;

      /* PS5 accent — clean white with depth */
      --ps-white:       #f0f4ff;
      --ps-silver:      #a8b4d0;
      --ps-blue:        #0070d1;
      --ps-highlight:   rgba(255,255,255,0.06);

      /* Text */
      --text-primary:   #edf0ff;
      --text-secondary: #a8bbdf;
      --text-muted:     #7f95bf;

      /* Borders */
      --border-subtle:  rgba(0, 212, 255, 0.10);
      --border-active:  rgba(0, 212, 255, 0.45);

      /* Ranks */
      --rank-1: #ffd700;
      --rank-2: #c0c0c0;
      --rank-3: #cd7f32;

      /* Fonts */
      --font-display: 'Michroma', sans-serif;
      --font-body:    'Space Grotesk', sans-serif;
      --font-mono:    'JetBrains Mono', monospace;
      /* Transitions */
      --t-fast: 0.15s ease;
      --t-med:  0.3s ease;
      --t-slow: 0.65s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }

    body {
      font-family: var(--font-body);
      background: var(--bg-void);
      color: var(--text-primary);
      min-height: 100vh;
      overflow: hidden;
    }

    /* ── Scanlines (subtle, PS5-style crisp feel) ── */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 3px,
        rgba(0,0,0,0.06) 3px, rgba(0,0,0,0.06) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* ── BACKGROUND CANVAS ── */
    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    /* Techtrix gradient base */
    .bg-layer::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 90% 70% at 15% -10%, rgba(179,68,255,0.14) 0%, transparent 55%),
        radial-gradient(ellipse 70% 90% at 90% 110%, rgba(255,26,60,0.11) 0%, transparent 55%),
        radial-gradient(ellipse 50% 50% at 50% 50%, rgba(0,212,255,0.05) 0%, transparent 70%),
        var(--bg-void);
    }

    /* Animated corner glows */
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(130px);
      animation: orbFloat 18s ease-in-out infinite;
    }
    .bg-orb-1 {
      width: 700px; height: 700px;
      top: -250px; left: -250px;
      background: radial-gradient(circle, rgba(179,68,255,0.16), transparent 70%);
    }
    .bg-orb-2 {
      width: 600px; height: 600px;
      bottom: -200px; right: -150px;
      background: radial-gradient(circle, rgba(255,26,60,0.12), transparent 70%);
      animation-delay: -9s;
    }
    .bg-orb-3 {
      width: 500px; height: 500px;
      top: 40%; left: 45%;
      background: radial-gradient(circle, rgba(0,212,255,0.07), transparent 70%);
      animation-delay: -14s;
    }
    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%       { transform: translate(40px, -50px) scale(1.06); }
      66%       { transform: translate(-25px, 25px) scale(0.94); }
    }

    /* PS5-style grid lines */
    .bg-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
    }

    /* ── MAIN LAYOUT ── */
    .lb-wrapper {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.4rem 2rem 1rem;
      gap: 0;
    }

    /* ══ HEADER ══════════════════════════════════════════════════ */
    .lb-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 1.2rem;
      flex-shrink: 0;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(0,212,255,0.08);
      position: relative;
    }

    /* Techtrix logo */
    .lb-brand {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .lb-logo-img {
      height: 72px;
      width: auto;
      filter:
        drop-shadow(0 0 18px rgba(255,26,60,0.7))
        drop-shadow(0 0 36px rgba(0,180,255,0.45))
        drop-shadow(0 0 6px rgba(255,255,255,0.15));
      transition: filter 0.3s ease, transform 0.3s ease;
    }
    .lb-logo-img:hover {
      filter:
        drop-shadow(0 0 28px rgba(255,26,60,0.9))
        drop-shadow(0 0 50px rgba(0,180,255,0.6))
        drop-shadow(0 0 8px rgba(255,255,255,0.25));
      transform: scale(1.04);
    }

    .lb-brand-divider {
      width: 1px;
      height: 40px;
      background: linear-gradient(180deg, transparent, rgba(0,212,255,0.4), transparent);
    }

    .lb-title-block { }

    .lb-event-tag {
      font-family: var(--font-display);
      font-size: clamp(0.5rem, 1.1vw, 0.68rem);
      font-weight: 600;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: var(--neon-red);
      text-shadow: 0 0 12px var(--neon-red-glow);
      margin-bottom: 0.2rem;
    }

    .lb-main-title {
      font-family: var(--font-display);
      font-size: clamp(1.6rem, 3.8vw, 3.2rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0.04em;
      background: linear-gradient(100deg, #ffffff 0%, #b0d0ff 35%, #00d4ff 65%, #b344ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Right side — live badge & stats */
    .lb-header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.6rem;
    }

    .lb-badges {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    /* PS5-style LIVE pill */
    .live-pill {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 1rem 0.35rem 0.75rem;
      border-radius: 50px;
      border: 1px solid rgba(0,255,136,0.35);
      background: rgba(0,255,136,0.06);
      backdrop-filter: blur(10px);
      font-family: var(--font-display);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: var(--neon-green);
      text-shadow: 0 0 8px var(--neon-green);
      transition: all var(--t-med);
    }

    .live-pill.offline {
      border-color: rgba(255,26,60,0.35);
      background: rgba(255,26,60,0.06);
      color: var(--neon-red);
      text-shadow: 0 0 8px var(--neon-red-glow);
    }

    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      animation: dotPulse 2s ease-in-out infinite;
    }
    .status-dot.live    { background: var(--neon-green); box-shadow: 0 0 6px var(--neon-green); }
    .status-dot.offline { background: var(--neon-red);   box-shadow: 0 0 6px var(--neon-red); animation-play-state: paused; }

    @keyframes dotPulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:0.5; transform:scale(0.8); }
    }

    .lb-player-count {
      font-family: var(--font-display);
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .admin-link {
      font-family: var(--font-display);
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-decoration: none;
      padding: 0.3rem 0.7rem;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 4px;
      transition: all var(--t-med);
    }
    .admin-link:hover {
      color: var(--neon-blue);
      border-color: var(--border-active);
      background: rgba(0,212,255,0.05);
    }

    /* ══ PS5 SCORE SUMMARY PODS ═══════════════════════════════ */
    .lb-summary {
      display: flex;
      gap: 0.8rem;
      margin-bottom: 1rem;
      flex-shrink: 0;
    }

    .summary-pod {
      flex: 1;
      background: rgba(10,14,28,0.7);
      border: 1px solid rgba(0,212,255,0.09);
      border-radius: 10px;
      padding: 0.65rem 1rem;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(16px);
      transition: border-color var(--t-med);
    }
    .summary-pod::before {
      content:'';
      position:absolute;
      top:0; left:0; right:0;
      height:1px;
      background: linear-gradient(90deg, transparent, rgba(0,212,255,0.25), transparent);
    }
    .summary-pod:hover { border-color: rgba(0,212,255,0.2); }

    .pod-label {
      font-family: var(--font-display);
      font-size: 0.52rem;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.3rem;
    }

    .pod-value {
      font-family: var(--font-display);
      font-size: clamp(1rem, 2vw, 1.5rem);
      font-weight: 900;
      line-height: 1;
      color: var(--text-primary);
    }

    .pod-value.accent-blue   { color: var(--neon-blue);   text-shadow: 0 0 10px rgba(0,212,255,0.4); }
    .pod-value.accent-gold   { color: var(--neon-gold);   text-shadow: 0 0 10px rgba(255,215,0,0.4); }
    .pod-value.accent-green  { color: var(--neon-green);  text-shadow: 0 0 10px rgba(0,255,136,0.3); }
    .pod-value.accent-red    { color: var(--neon-red);    text-shadow: 0 0 10px rgba(255,26,60,0.4); }
    .pod-value.accent-purple { color: var(--neon-purple); text-shadow: 0 0 10px rgba(179,68,255,0.4); }

    /* ══ TABLE HEADER ═══════════════════════════════════════════ */
    .lb-table-header {
      display: grid;
      grid-template-columns: 72px 2fr 1.4fr 70px 70px 72px 88px 96px 108px;
      gap: 0.5rem;
      padding: 0.5rem 1.4rem;
      margin-bottom: 0.4rem;
      flex-shrink: 0;
    }

    .col-head {
      font-family: var(--font-display);
      font-size: clamp(0.42rem, 0.9vw, 0.58rem);
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .col-head.center { text-align: center; }

    /* ══ ROWS CONTAINER ═════════════════════════════════════════ */
    .lb-rows {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    /* ══ INDIVIDUAL ROW — PS5 card style ═══════════════════════ */
    .lb-row {
      display: grid;
      grid-template-columns: 72px 2fr 1.4fr 70px 70px 72px 88px 96px 108px;
      gap: 0.5rem;
      align-items: center;
      padding: 0.75rem 1.4rem;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: rgba(10, 14, 28, 0.68);
      backdrop-filter: blur(16px);
      position: relative;
      overflow: hidden;
      transition: transform var(--t-slow), border-color var(--t-med), background var(--t-med);
      will-change: transform;
      cursor: default;
    }

    /* PS5-style shimmer top edge */
    .lb-row::after {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.07), transparent);
      transition: opacity var(--t-med);
    }

    /* Left accent bar */
    .lb-row::before {
      content: '';
      position: absolute;
      left: 0; top: 8px; bottom: 8px;
      width: 2px;
      border-radius: 0 2px 2px 0;
      background: var(--border-subtle);
      transition: background var(--t-med), box-shadow var(--t-med);
    }

    .lb-row:hover {
      border-color: rgba(0,212,255,0.18);
      background: rgba(12, 18, 36, 0.82);
    }
    .lb-row:hover::before {
      background: var(--neon-blue);
      box-shadow: 0 0 6px var(--neon-blue-glow);
    }

    /* ── Top 3 special rows ── */
    .lb-row[data-rank="1"] {
      background: linear-gradient(135deg, rgba(255,215,0,0.07) 0%, rgba(10,14,28,0.85) 60%);
      border-color: rgba(255,215,0,0.22);
      box-shadow: 0 0 24px rgba(255,215,0,0.06), inset 0 1px 0 rgba(255,215,0,0.12);
    }
    .lb-row[data-rank="1"]::before {
      background: var(--neon-gold);
      box-shadow: 0 0 8px var(--neon-gold-glow);
    }

    .lb-row[data-rank="2"] {
      background: linear-gradient(135deg, rgba(192,192,192,0.05) 0%, rgba(10,14,28,0.85) 60%);
      border-color: rgba(192,192,192,0.18);
    }
    .lb-row[data-rank="2"]::before {
      background: var(--rank-2);
      box-shadow: 0 0 6px rgba(192,192,192,0.3);
    }

    .lb-row[data-rank="3"] {
      background: linear-gradient(135deg, rgba(205,127,50,0.06) 0%, rgba(10,14,28,0.85) 60%);
      border-color: rgba(205,127,50,0.18);
    }
    .lb-row[data-rank="3"]::before {
      background: var(--rank-3);
      box-shadow: 0 0 6px rgba(205,127,50,0.3);
    }

    /* ── Rank change animations ── */
    .lb-row.rank-up {
      animation: flashUp 0.85s ease-out forwards;
    }
    @keyframes flashUp {
      0%   { background: rgba(10,14,28,0.68); border-color: var(--border-subtle); }
      35%  { background: rgba(0,255,136,0.10); border-color: rgba(0,255,136,0.45); box-shadow: 0 0 20px rgba(0,255,136,0.15); }
      100% { background: rgba(10,14,28,0.68); border-color: var(--border-subtle); }
    }
    .lb-row.rank-down {
      animation: flashDown 0.85s ease-out forwards;
    }
    @keyframes flashDown {
      0%   { background: rgba(10,14,28,0.68); border-color: var(--border-subtle); }
      35%  { background: rgba(255,26,60,0.09); border-color: rgba(255,26,60,0.4); box-shadow: 0 0 20px rgba(255,26,60,0.12); }
      100% { background: rgba(10,14,28,0.68); border-color: var(--border-subtle); }
    }

    /* ── Row cells ── */
    .col-rank {
      font-family: var(--font-display);
      font-size: clamp(1rem, 2.2vw, 1.5rem);
      font-weight: 900;
      text-align: center;
      line-height: 1;
    }

    .col-fighter { overflow: hidden; }

    .fighter-tag {
      font-family: var(--font-display);
      font-size: clamp(0.85rem, 1.8vw, 1.2rem);
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: 0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .fighter-name {
      font-size: clamp(0.6rem, 1.1vw, 0.75rem);
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.02em;
      margin-top: 0.1rem;
    }

    .col-college {
      font-family: var(--font-body);
      font-size: clamp(0.6rem, 1.1vw, 0.75rem);
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.02em;
    }

    .col-num {
      font-family: var(--font-display);
      font-size: clamp(0.9rem, 1.8vw, 1.2rem);
      font-weight: 800;
      text-align: center;
      line-height: 1;
    }

    .col-streak {
      font-family: var(--font-display);
      font-size: clamp(0.85rem, 1.7vw, 1.1rem);
      font-weight: 800;
      text-align: center;
    }

    .col-ratio {
      font-family: var(--font-mono);
      font-size: clamp(0.78rem, 1.5vw, 1rem);
      text-align: center;
      color: var(--text-secondary);
      line-height: 1.3;
    }

    .col-matches {
      font-family: var(--font-display);
      font-size: clamp(0.9rem, 1.8vw, 1.2rem);
      font-weight: 800;
      text-align: center;
    }

    /* Score — PS5 "trophy" style */
    .col-score {
      font-family: var(--font-display);
      font-size: clamp(1rem, 2.2vw, 1.5rem);
      font-weight: 900;
      text-align: center;
      color: var(--neon-blue);
      text-shadow: 0 0 14px rgba(0,212,255,0.55);
      line-height: 1;
    }

    /* ── Streak fire ── */
    .streak-fire.hot {
      animation: fireGlow 1s ease-in-out infinite alternate;
    }
    @keyframes fireGlow {
      from { color: #ff4400; text-shadow: 0 0 5px rgba(255,68,0,0.6); }
      to   { color: #ffd700; text-shadow: 0 0 16px rgba(255,215,0,0.9); }
    }

    /* ── Rank medals ── */
    .rank-1 { color: var(--rank-1); text-shadow: 0 0 12px var(--neon-gold-glow); }
    .rank-2 { color: var(--rank-2); text-shadow: 0 0 8px rgba(192,192,192,0.5); }
    .rank-3 { color: var(--rank-3); text-shadow: 0 0 8px rgba(205,127,50,0.5); }

    /* ══ FOOTER ═════════════════════════════════════════════════ */
    .lb-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.8rem;
      padding-top: 0.7rem;
      border-top: 1px solid rgba(0,212,255,0.07);
      flex-shrink: 0;
    }

    .lb-formula {
      font-family: var(--font-mono);
      font-size: clamp(0.52rem, 0.9vw, 0.68rem);
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }
    .lb-formula span { color: var(--neon-purple); }

    .lb-footer-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .lb-footer-logo {
      height: 22px;
      opacity: 0.35;
      filter: grayscale(0.3) brightness(0.8);
    }

    .lb-updated {
      font-family: var(--font-mono);
      font-size: clamp(0.52rem, 0.9vw, 0.68rem);
      color: var(--text-muted);
    }

    /* ══ EMPTY STATE ════════════════════════════════════════════ */
    .lb-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 1rem;
    }
    .lb-empty-icon {
      font-size: 4.5rem;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-14px); }
    }
    .lb-empty-text {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.25em;
    }

    /* ══ DISCONNECTION TOAST ════════════════════════════════════ */
    .conn-overlay {
      position: fixed;
      bottom: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,26,60,0.12);
      border: 1px solid rgba(255,26,60,0.38);
      border-radius: 50px;
      padding: 0.38rem 1.4rem;
      font-family: var(--font-display);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--neon-red);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--t-med);
      z-index: 500;
      backdrop-filter: blur(12px);
    }
    .conn-overlay.visible { opacity: 1; }

    /* ══ RESPONSIVE ═════════════════════════════════════════════ */
    @media (max-width: 960px) {
      .lb-table-header,
      .lb-row {
        grid-template-columns: 52px 1fr 64px 64px 80px;
      }
      .col-head:nth-child(3),
      .col-head:nth-child(6),
      .col-head:nth-child(7) { display: none; }
    }

    /* ══ ENTRY ANIMATION ════════════════════════════════════════ */
    @keyframes rowIn {
      from { opacity: 0; transform: translateX(-16px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .lb-row { animation: rowIn 0.4s ease-out both; }
  </style>
</head>

  <!-- ═══ SCRIPTS ═══════════════════════════════════════════════ -->
  <script>
    // ── API & WS base ────────────────────────────────────────────
    const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://localhost:8000/api'
      : `${window.location.origin}/api`;
    const WS_BASE = API_BASE.replace(/^http/, 'ws').replace('/api', '') + '/api';

    // ── Utilities ────────────────────────────────────────────────
    function escHtml(str) {
      if (!str) return '—';
      return String(str)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function getStreakDisplay(streak) {
      if (streak >= 5) return `🔥${streak}`;
      if (streak >= 3) return `⚡${streak}`;
      if (streak > 0)  return `✨${streak}`;
      return streak;
    }

    // ── State ────────────────────────────────────────────────────
    let prevRanks = {};
    const rowsEl   = document.getElementById('lb-rows');
    const livePill = document.getElementById('live-pill');
    const statusDot= document.getElementById('status-dot');
    const liveLabel= document.getElementById('live-label');
    const connOvl  = document.getElementById('conn-overlay');

    // ── Summary pods update ──────────────────────────────────────
    function updateSummary(entries, data) {
      document.getElementById('pod-total').textContent   = data.total_players ?? entries.length;
      // total matches = sum of total_matches / 2 (each match counted by both players)
      const totalMatches = entries.length
        ? Math.round(entries.reduce((s,e) => s + e.total_matches, 0) / 2)
        : 0;
      document.getElementById('pod-matches').textContent = totalMatches || '—';

      if (entries.length) {
        const top = entries[0];
        document.getElementById('pod-topscore').textContent = top.score;
        const hotStreak = Math.max(...entries.map(e => e.current_streak));
        document.getElementById('pod-streak').textContent   = hotStreak > 0 ? `🔥${hotStreak}` : '—';
        const bestWin = Math.max(...entries.map(e => parseFloat(e.win_ratio||0)));
        document.getElementById('pod-winrate').textContent  = bestWin > 0 ? `${bestWin}%` : '—';
      }
    }

    // ── FLIP Render ──────────────────────────────────────────────
    function renderLeaderboard(entries) {
      if (!entries || !entries.length) {
        rowsEl.innerHTML = `<div class="lb-empty"><div class="lb-empty-icon">🎮</div><div class="lb-empty-text">AWAITING FIGHTERS</div></div>`;
        prevRanks = {};
        return;
      }

      // FLIP — First
      const firstPos = {};
      rowsEl.querySelectorAll('.lb-row[data-player-id]').forEach(el => {
        firstPos[el.dataset.playerId] = el.getBoundingClientRect().top;
      });

      const newRanks = {};
      entries.forEach(e => { newRanks[e.player_id] = e.rank; });

      const rankEmojis = ['👑','🥈','🥉'];

      const rowsHTML = entries.map((entry, idx) => {
        const pid      = entry.player_id;
        const prevRank = prevRanks[pid];
        const newRank  = entry.rank;
        let changeClass = '';
        if (prevRank !== undefined && prevRank !== newRank) {
          changeClass = newRank < prevRank ? 'rank-up' : 'rank-down';
        }

        const rankDisplay = entry.rank <= 3
          ? `<span class="rank-${entry.rank}">${rankEmojis[entry.rank-1]}</span>`
          : `<span style="color:var(--text-secondary);font-size:clamp(0.9rem,1.8vw,1.2rem)">${entry.rank}</span>`;

        const streakDisplay = getStreakDisplay(entry.current_streak);
        const streakHot     = entry.current_streak >= 3 ? 'hot' : '';
        const streakColor   = entry.current_streak >= 5 ? 'var(--neon-red)'
          : entry.current_streak >= 3 ? 'var(--neon-gold)'
          : entry.current_streak > 0  ? 'var(--neon-green)'
          : 'var(--text-muted)';

        return `
          <div class="lb-row ${changeClass}"
               data-rank="${entry.rank}"
               data-player-id="${pid}"
               style="animation-delay:${idx * 0.04}s">
            <div class="col-rank">${rankDisplay}</div>
            <div class="col-fighter">
              <div class="fighter-tag">${escHtml(entry.tekken_name)}</div>
              <div class="fighter-name">${escHtml(entry.full_name)}</div>
            </div>
            <div class="col-college">${escHtml(entry.college_name || '—')}</div>
            <div class="col-num" style="color:var(--neon-green)">${entry.wins}</div>
            <div class="col-num" style="color:var(--neon-red)">${entry.losses}</div>
            <div class="col-matches col-num" style="color:var(--text-secondary)">${entry.total_matches}</div>
            <div class="col-streak streak-fire ${streakHot}" style="color:${streakColor}">${streakDisplay}</div>
            <div class="col-ratio">${entry.win_ratio}%<br><span style="font-size:0.68em;color:var(--text-muted)">${entry.wins}/${entry.losses}</span></div>
            <div class="col-score">${entry.score}</div>
          </div>`;
      });

      rowsEl.innerHTML = rowsHTML.join('');

      // FLIP — Last → Invert → Play
      rowsEl.querySelectorAll('.lb-row[data-player-id]').forEach(el => {
        const pid = el.dataset.playerId;
        if (firstPos[pid] !== undefined) {
          const delta = firstPos[pid] - el.getBoundingClientRect().top;
          if (Math.abs(delta) > 2) {
            el.style.transform  = `translateY(${delta}px)`;
            el.style.transition = 'none';
            el.getBoundingClientRect(); // force reflow
            el.style.transition = 'transform 0.7s cubic-bezier(0.4,0,0.2,1)';
            el.style.transform  = '';
          }
        }
      });

      prevRanks = newRanks;
    }

    // ── Meta update ──────────────────────────────────────────────
    function updateMeta(data, entries) {
      const count = data.total_players ?? (entries ? entries.length : 0);
      document.getElementById('player-count').textContent =
        `${count} Fighter${count !== 1 ? 's' : ''}`;
      if (data.last_updated) {
        document.getElementById('last-updated').textContent =
          `Updated: ${new Date(data.last_updated).toLocaleTimeString('en-IN')}`;
      }
      if (entries) updateSummary(entries, data);
    }

    // ── Connection state ─────────────────────────────────────────
    function setConnected(connected) {
      if (connected) {
        livePill.className = 'live-pill';
        statusDot.className = 'status-dot live';
        liveLabel.textContent = 'LIVE';
        connOvl.classList.remove('visible');
      } else {
        livePill.className = 'live-pill offline';
        statusDot.className = 'status-dot offline';
        liveLabel.textContent = 'RECONNECTING';
        connOvl.classList.add('visible');
      }
    }

    // ── WebSocket ────────────────────────────────────────────────
    let reconnectDelay = 1000;
    let pingTimer = null;

    function connectWS() {
      let ws;
      try { ws = new WebSocket(WS_BASE + '/ws/leaderboard'); }
      catch(e) { scheduleReconnect(); return; }

      ws.onopen = () => {
        reconnectDelay = 1000;
        setConnected(true);
        pingTimer = setInterval(() => {
          if (ws.readyState === WebSocket.OPEN) ws.send('ping');
        }, 25000);
      };

      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'leaderboard_update') {
            renderLeaderboard(msg.data.entries);
            updateMeta(msg.data, msg.data.entries);
          }
        } catch (_) {}
      };

      ws.onclose = () => {
        clearInterval(pingTimer);
        setConnected(false);
        scheduleReconnect();
      };

      ws.onerror = () => ws.close();
    }

    function scheduleReconnect() {
      setTimeout(connectWS, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 1.5, 30000);
    }

    // ── Initial HTTP load ────────────────────────────────────────
    async function initialLoad() {
      try {
        const data = await fetch(API_BASE + '/leaderboard').then(r => r.json());
        renderLeaderboard(data.entries);
        updateMeta(data, data.entries);
      } catch (_) {}
    }

    // ── Init ─────────────────────────────────────────────────────
    initialLoad();
    connectWS();

    // Fullscreen on double-click
    document.addEventListener('dblclick', () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
      else document.exitFullscreen();
    });
  </script>

</body>
</html>
